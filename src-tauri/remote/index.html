<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b09" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Carbon" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-256.png" />
    <link rel="apple-touch-icon" href="/icon-256.png" />
    <link rel="stylesheet" href="/app.css" />
    <title>Carbon Remote</title>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><img id="ambient" alt="" /></div>

    <header class="top">
      <span class="brand">
        <svg width="22" height="22" viewBox="0 0 1024 1024" aria-hidden="true">
          <path fill="#FAE91D" d="M512 0 955.41 256 955.41 384 733.7 384 512 256 290.3 384 290.3 640 512 768 733.7 640 955.41 640 955.41 768 512 1024 68.59 768 68.59 256Z" />
        </svg>
        Carbon
      </span>
      <span class="link" id="link" data-state="busy" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="link-text">Connecting…</span>
      </span>
    </header>

    <main id="player" class="player" hidden>
      <figure class="art" id="art-frame" data-empty="true">
        <img id="art" alt="" width="640" height="640" />
      </figure>

      <section class="meta">
        <h1 id="title">Nothing playing</h1>
        <p id="artists" class="muted">Pick something in Carbon</p>
      </section>

      <section class="scrub">
        <input id="seek" class="range" type="range" min="0" max="0" step="1000" value="0" aria-label="Seek" disabled />
        <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      </section>

      <section class="transport glass" aria-label="Playback">
        <button id="shuffle" class="icon" type="button" aria-label="Shuffle" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="stroke" d="M4 7h3.5c4.5 0 4.5 10 9 10H20M4 17h3.5c1.6 0 2.6-1.3 3.4-3M20 7h-3.5c-1.6 0-2.6 1.3-3.4 3M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5" /></svg>
        </button>
        <button id="previous" class="icon" type="button" aria-label="Previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M18 5.5v13l-9-6.5z" /><path class="stroke" d="M6.5 5v14" /></svg>
        </button>
        <button id="toggle" class="play" type="button" aria-label="Play" data-paused="true">
          <svg class="when-paused" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z" /></svg>
          <svg class="when-playing" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z" /></svg>
        </button>
        <button id="next" class="icon" type="button" aria-label="Next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M6 5.5v13l9-6.5z" /><path class="stroke" d="M17.5 5v14" /></svg>
        </button>
        <button id="repeat" class="icon" type="button" aria-label="Repeat: off" data-mode="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="stroke" d="M5 11V9a3 3 0 0 1 3-3h11M16 3l3 3-3 3M19 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3" /></svg>
          <span class="badge" aria-hidden="true">1</span>
        </button>
      </section>

      <section class="volume" id="volume-row" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="stroke" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /></svg>
        <input id="volume" class="range" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Volume" />
      </section>

      <section class="queue" id="queue-row" hidden>
        <p class="eyebrow">Up next</p>
        <ol id="queue"></ol>
      </section>
    </main>

    <main id="pair" class="pair" hidden>
      <div class="card glass">
        <p class="eyebrow">Phone remote</p>
        <h1>Pair with Carbon</h1>
        <p class="muted">On your PC, open Carbon, go to Settings → Remote and scan the QR code, or type the 6-digit code here.</p>
        <form id="pair-form" novalidate>
          <label class="sr-only" for="code">Pairing code</label>
          <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required />
          <button class="primary" type="submit">Connect</button>
        </form>
        <button id="retry" class="secondary" type="button" hidden>Reconnect</button>
        <p id="pair-error" class="error" role="alert"></p>
      </div>
    </main>
  </body>
</html>
