[package]
name = "carbon"
version = "0.2.0"
description = "Carbon, a glass Spotify client"
authors = ["pealz"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "carbon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
souvlaki = "0.9"
discord-rich-presence = "1"
md5 = "0.8"
# Same major as tauri-plugin-updater uses, so only one reqwest ends up in the binary.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net", "rt"] }
socketioxide = { version = "0.18", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
