name: Release

# Build both installers into one draft and publish once the updater lists both Mac architectures and Windows.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - runner: windows-latest
            args: ""
          - runner: macos-15
            args: "--target universal-apple-darwin"
          - runner: ubuntu-22.04
            args: ""
          - runner: ubuntu-22.04-arm
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-desktop
        if: runner.os == 'Linux'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The bundler downloads these from GitHub releases without retrying, which sometimes 504s.
      # Seed its cache with retries instead. Keep versions in sync with tauri-bundler's NSIS module.
      - name: Pre-fetch NSIS tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Downloads through the GitHub API, retrying, then checks the hashes the bundler expects.
          function Fetch($repo, $tag, $file, $dir) {
            for ($i = 1; $i -le 6; $i++) {
              gh release download $tag -R $repo -p $file -D $dir --clobber
              if ($LASTEXITCODE -eq 0) { return }
              Start-Sleep -Seconds (5 * $i)
            }
            throw "could not download $file from $repo"
          }
          $tools = Join-Path $env:LOCALAPPDATA "tauri"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Fetch "tauri-apps/binary-releases" "nsis-3.13" "nsis-3.13.zip" $env:RUNNER_TEMP
          Expand-Archive "$env:RUNNER_TEMP\nsis-3.13.zip" -DestinationPath $tools -Force
          Rename-Item (Join-Path $tools "nsis-3.13") "NSIS"
          $plugins = Join-Path $tools "NSIS\Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force $plugins | Out-Null
          Fetch "tauri-apps/nsis-tauri-utils" "nsis_tauri_utils-v0.5.3" "nsis_tauri_utils.dll" $plugins
          $exe = (Get-FileHash (Join-Path $tools "NSIS\NSIS.exe") -Algorithm SHA1).Hash
          $dll = (Get-FileHash "$plugins\nsis_tauri_utils.dll" -Algorithm SHA1).Hash
          if ($exe -ne "6D45D4E8CCF18FE1FDAC9164058F356102A2ECF2") { throw "NSIS.exe hash mismatch: $exe" }
          if ($dll -ne "75197FEE3C6A814FE035788D1C34EAD39349B860") { throw "nsis_tauri_utils.dll hash mismatch: $dll" }

      # Integration keys are baked in at build time from repository secrets (never committed).
      - name: Write build keys
        shell: bash
        run: |
          {
            echo "CARBON_DISCORD_APP_ID=${{ secrets.CARBON_DISCORD_APP_ID }}"
            echo "CARBON_LASTFM_API_KEY=${{ secrets.CARBON_LASTFM_API_KEY }}"
            echo "CARBON_LASTFM_SECRET=${{ secrets.CARBON_LASTFM_SECRET }}"
            # Accounts are live at api.getcarbon.cc, so release builds require a Carbon sign-in.
            echo "VITE_REQUIRE_CARBON_ACCOUNT=true"
          } > .env.local

      - name: Configure Apple signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
          else
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [[ -n "${!name}" ]]; then printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"; fi
            done
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Carbon ${{ github.ref_name }}
          releaseBody: Download the installer below. New here? The setup guide is at https://getcarbon.cc/setup.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - uses: ./.github/actions/macos-images
        if: runner.os == 'macOS'
      - name: Upload Mac disk images
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" src-tauri/target/{aarch64,x86_64}-apple-darwin/release/bundle/dmg/*.dmg --clobber

  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Verify updater and publish
        run: |
          gh release download "$TAG" -p latest.json
          jq -e '[.platforms["windows-x86_64"], .platforms["darwin-aarch64"], .platforms["darwin-x86_64"], .platforms["linux-x86_64"], .platforms["linux-aarch64"]] | all(.[]; (.signature | length) > 0 and (.url | startswith("https://")))' latest.json
          gh release edit "$TAG" --draft=false --latest
