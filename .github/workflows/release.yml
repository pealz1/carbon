name: Release

# Build native packages in parallel. Publish a single update manifest after all uploads finish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_run:
        description: Native tag build to finish publishing
        required: true
        type: string

permissions: {}
concurrency:
  group: carbon-release-${{ inputs.build_run || github.run_id }}
  cancel-in-progress: false

jobs:
  draft:
    permissions:
      contents: write # Create the draft release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: draft
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Carbon $TAG" --notes-file .github/release-notes.md
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  release:
    permissions:
      contents: write # Upload the native packages to the draft.
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            args: ""
          - runner: macos-15
            args: "--target universal-apple-darwin"
          - runner: ubuntu-22.04
            args: ""
          - runner: ubuntu-22.04-arm
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-desktop
        if: runner.os == 'Linux'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - run: npm ci

      # The bundler downloads these from GitHub releases without retrying, which sometimes 504s.
      # Seed its cache with retries instead. Keep versions in sync with tauri-bundler's NSIS module.
      - name: Pre-fetch NSIS tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Downloads through the GitHub API, retrying, then checks the hashes the bundler expects.
          function Fetch($repo, $tag, $file, $dir) {
            for ($i = 1; $i -le 6; $i++) {
              gh release download $tag -R $repo -p $file -D $dir --clobber
              if ($LASTEXITCODE -eq 0) { return }
              Start-Sleep -Seconds (5 * $i)
            }
            throw "could not download $file from $repo"
          }
          $tools = Join-Path $env:LOCALAPPDATA "tauri"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Fetch "tauri-apps/binary-releases" "nsis-3.13" "nsis-3.13.zip" $env:RUNNER_TEMP
          Expand-Archive "$env:RUNNER_TEMP\nsis-3.13.zip" -DestinationPath $tools -Force
          Rename-Item (Join-Path $tools "nsis-3.13") "NSIS"
          $plugins = Join-Path $tools "NSIS\Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force $plugins | Out-Null
          Fetch "tauri-apps/nsis-tauri-utils" "nsis_tauri_utils-v0.5.3" "nsis_tauri_utils.dll" $plugins
          $exe = (Get-FileHash (Join-Path $tools "NSIS\NSIS.exe") -Algorithm SHA1).Hash
          $dll = (Get-FileHash "$plugins\nsis_tauri_utils.dll" -Algorithm SHA1).Hash
          if ($exe -ne "6D45D4E8CCF18FE1FDAC9164058F356102A2ECF2") { throw "NSIS.exe hash mismatch: $exe" }
          if ($dll -ne "75197FEE3C6A814FE035788D1C34EAD39349B860") { throw "nsis_tauri_utils.dll hash mismatch: $dll" }

      - name: Configure Apple signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
          else
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [[ -n "${!name}" ]]; then printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"; fi
            done
          fi

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          CARBON_DISCORD_APP_ID: ${{ secrets.CARBON_DISCORD_APP_ID }}
          CARBON_LASTFM_API_KEY: ${{ secrets.CARBON_LASTFM_API_KEY }}
          CARBON_LASTFM_SECRET: ${{ secrets.CARBON_LASTFM_SECRET }}
          VITE_REQUIRE_CARBON_ACCOUNT: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          releaseName: Carbon ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - uses: ./.github/actions/macos-images
        if: runner.os == 'macOS'
      - name: Upload Mac disk images
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" src-tauri/target/{aarch64,x86_64}-apple-darwin/release/bundle/dmg/*.dmg --clobber

  publish:
    permissions:
      actions: read # Verify the completed native build.
      contents: write # Publish the signed update manifest.
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select the completed native build
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_ID: ${{ inputs.build_run }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run view "$RUN_ID" --json event,workflowName,headBranch,jobs > "$RUNNER_TEMP/build.json"
          tag=$(jq -er 'select(.event == "push" and .workflowName == "Release")
            | select([.jobs[] | select(.name | startswith("release (")) | .conclusion] == ["success","success","success","success"])
            | .headBranch | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$RUNNER_TEMP/build.json")
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Verify assets and publish the signed update index
        run: |
          python3 .github/release-manifest.py "$TAG" "$GH_REPO"
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --notes-file .github/release-notes.md --draft=false --latest
