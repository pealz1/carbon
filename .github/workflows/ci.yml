name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux packages (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-desktop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Check packages and launch Carbon
        run: |
          bundle=src-tauri/target/release/bundle
          dpkg-deb --info "$bundle"/deb/*.deb >/dev/null
          rpm -qp "$bundle"/rpm/*.rpm >/dev/null
          app=$(realpath "$bundle"/appimage/*.AppImage)
          (cd "$RUNNER_TEMP" && "$app" --appimage-extract >/dev/null)
          xvfb-run -a dbus-run-session -- bash -ec '
            "$RUNNER_TEMP/squashfs-root/AppRun" >"$RUNNER_TEMP/carbon.log" 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            for attempt in {1..30}; do
              if "$RUNNER_TEMP/squashfs-root/AppRun" now-playing --json 2>/dev/null | jq -e ".status == \"stopped\""; then exit 0; fi
              sleep 1
            done
            cat "$RUNNER_TEMP/carbon.log"
            exit 1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Carbon-${{ matrix.runner }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  macos:
    name: Native tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  macos-bundle:
    name: Universal macOS installer
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      APPLE_SIGNING_IDENTITY: "-"
      VITE_REQUIRE_CARBON_ACCOUNT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri -- build --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify bundle
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/Carbon.app"
          plist="$app/Contents/Info.plist"
          binary="$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$plist")"
          lipo "$binary" -verify_arch x86_64 arm64
          codesign --verify --strict --deep "$app"
          test "$(plutil -extract LSMinimumSystemVersion raw "$plist")" = "11.0"
          test "$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$plist")" = "carbon"
          hdiutil verify "$bundle"/dmg/*.dmg
          open -n "$app"
          for attempt in {1..30}; do
            if "$binary" now-playing --json > "$RUNNER_TEMP/carbon-state.json"; then break; fi
            sleep 1
          done
          jq -e '.status == "stopped"' "$RUNNER_TEMP/carbon-state.json"
      - uses: ./.github/actions/macos-images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Carbon-macOS-universal
          path: src-tauri/target/*-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  check:
    name: Lint, type-check and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check
      - run: python .github/test_release_manifest.py
      - run: npx vitest run
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

      - name: SDK (install, check, test, build)
        working-directory: packages/carbon-sdk
        shell: bash # fails on the first failing command (pwsh only checks the last)
        run: |
          npm ci
          npm run check
          npm test
          npm run build
