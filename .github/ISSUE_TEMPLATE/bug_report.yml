name: Bug report
description: Something in Carbon isn't working right
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. The more specific you are, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open an album
        2. Press play on the third song
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Carbon version
      description: Settings → Updates shows it.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Please blur anything personal.
